<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PediaCare{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243247;
        }

        header {
            background: #176b87;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 32px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin: 7px 0 16px;
            border: 1px solid #ccd5df;
            border-radius: 6px;
            font: inherit;
        }

        button, .button {
            display: inline-block;
            background: #176b87;
            color: white;
            border: none;
            padding: 11px 17px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font: inherit;
        }

        button:hover, .button:hover {
            background: #10536a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5eaf0;
            text-align: left;
        }

        th {
            background: #edf5f8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #667085;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            main {
                width: 94%;
                padding: 18px;
                margin: 18px auto;
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>PediaCare</h1>
        <nav>
            <a href="{{ url_for('auth.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('patients.list_patients') }}">Patients</a>
            <a href="{{ url_for('patients.add_patient') }}">Add Patient</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        PediaCare | Pediatric Hospital Management System
    </footer>
</body>
</html>
