<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PediaCare</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fb;
            color: #243447;
        }
        header {
            background: #167d9a;
            color: white;
            padding: 20px 7%;
        }
        main { max-width: 900px; margin: 35px auto; padding: 0 20px; }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px #20344a10;
        }
        .role {
            display: inline-block;
            padding: 6px 10px;
            background: #e0f4f8;
            color: #126780;
            border-radius: 6px;
            text-transform: capitalize;
        }
        button {
            padding: 10px 18px;
            background: #167d9a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>PediaCare</h1>
        <p>Pediatric Hospital Management System</p>
    </header>

    <main>
        <section class="card">
            <h2>Welcome, {{ user.full_name }}!</h2>
            <p>You are logged in successfully.</p>
            <p>Account role: <span class="role">{{ user.role }}</span></p>
        </section>

        <section class="card">
            <h2>Your dashboard</h2>
            <p>Patient registration, appointments, and pediatric health
               features will be added in the next development steps.</p>
        </section>

        <form method="POST" action="{{ url_for('auth.logout') }}">
            <button type="submit">Log out</button>
        </form>
    </main>
</body>
</html>
