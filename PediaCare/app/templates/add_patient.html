{% extends "base.html" %}

{% block title %}Register Patient | PediaCare{% endblock %}

{% block content %}
<h2>Register a New Patient</h2>
<p>Enter all required patient information below.</p>

<form method="POST">

    <label for="full_name">Patient Full Name</label>
    <input type="text" id="full_name" name="full_name"
           placeholder="Enter full name" required>

    <label for="date_of_birth">Date of Birth</label>
    <input type="date" id="date_of_birth" name="date_of_birth"
           required>

    <label for="sex">Sex</label>
    <select id="sex" name="sex" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <label for="guardian_name">Parent/Guardian Name</label>
    <input type="text" id="guardian_name" name="guardian_name"
           placeholder="Enter parent or guardian name" required>

    <label for="guardian_phone">Parent/Guardian Phone</label>
    <input type="tel" id="guardian_phone" name="guardian_phone"
           placeholder="Enter contact number" required>

    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3"
              placeholder="Enter residential address" required></textarea>

    <button type="submit">Register Patient</button>
    <a href="{{ url_for('patients.list_patients') }}">Cancel</a>

</form>
{% endblock %}
