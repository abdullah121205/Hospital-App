<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient | PediaCare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 { color: #174a72; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccd4dd;
            border-radius: 6px;
        }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            background: #176b87;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .message { padding: 10px; background: #fff3cd; }
        a { color: #176b87; }
    </style>
</head>
<body>
<div class="container">
    <h1>Register a Patient</h1>
    <p>Enter the child's details and parent/guardian contact information.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        <label for="full_name">Child's Full Name *</label>
        <input id="full_name" name="full_name" maxlength="120" required>

        <label for="date_of_birth">Date of Birth *</label>
        <input id="date_of_birth" name="date_of_birth" type="date" required>

        <label for="sex">Sex *</label>
        <select id="sex" name="sex" required>
            <option value="">Select an option</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="guardian_name">Parent/Guardian Name *</label>
        <input id="guardian_name" name="guardian_name" maxlength="120" required>

        <label for="guardian_phone">Parent/Guardian Phone *</label>
        <input id="guardian_phone" name="guardian_phone"
               type="tel" maxlength="20" required>

        <label for="address">Address</label>
        <textarea id="address" name="address" maxlength="255" rows="3"></textarea>

        <button type="submit">Register Patient</button>
    </form>

    <p><a href="{{ url_for('patients.list_patients') }}">View Patients</a></p>
    <p><a href="{{ url_for('auth.dashboard') }}">Back to Dashboard</a></p>
</div>
</body>
</html>
